name: Rune checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compiler-and-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install host compilers and test tools
        run: sudo apt-get update && sudo apt-get install -y smlnj polyml mlton gcc clang make python3 curl perl tar
      - run: make test-all
      - run: make test-builds
      - run: make test-sanitize
      - name: Clang strict build and sanitizers
        run: |
          make CC=clang HOST=polyml test
          make CC=clang test-sanitize
  vm-portability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install host compilers and portability tools
        run: |
          sudo apt-get update
          sudo apt-get install -y smlnj polyml mlton gcc make python3 clang curl perl tar \
            qemu-user gcc-multilib libc6-dev-i386 binutils-powerpc64-linux-gnu \
            libc6-dev-ppc64-cross libgcc-13-dev-ppc64-cross
      - run: make test-portability
