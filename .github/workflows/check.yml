name: Rune checks
on: [push, pull_request]
jobs:
  compiler-and-vm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host compilers and test tools
        run: sudo apt-get update && sudo apt-get install -y smlnj polyml mlton gcc make python3
      - run: make test-all
      - run: make test-builds
      - run: make test-sanitize
